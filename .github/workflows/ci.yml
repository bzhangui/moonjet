name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned official reference clients (test only)
        run: npm ci --ignore-scripts
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Install current stable MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --show-error --location https://cli.moonbitlang.com/install/unix.sh --output "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install current stable MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'install-moon.ps1'
          Invoke-WebRequest 'https://cli.moonbitlang.com/install/powershell.ps1' -OutFile $installerPath
          & $installerPath
          if (-not $?) { throw 'MoonBit installation failed' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - name: Check build real broker tests TLS scenarios and coverage
        run: node scripts/validate.mjs
      - name: Portable runtime bundle
        run: node scripts/verify-portable.mjs
